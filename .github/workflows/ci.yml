name: CI Pipeline

on:
  push:
    branches:
      - dev
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm test

      - name: Build app
        run: npm run build

      - name: Login to Docker Hub
        run: echo dckr_pat_xk6SBkFuIkuZgEuYMF3zILcqg0o  | docker login -u loayouerghemmi  --password-stdin

      - name: Build Docker image
        run: docker build -t loayouerghemmi/weather-app .

      - name: Push Docker image
        run: docker push loayouerghemmi/weather-app
